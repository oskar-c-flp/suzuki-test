name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Install Vercel CLI
        if: always()
        run: npm install -g vercel

      - name: Deploy Allure report to Vercel
        if: always()
        id: vercel_deploy
        run: |
          URL=$(vercel deploy allure-report --token=${{ secrets.VERCEL_TOKEN }} --yes --prod=false)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish report link to summary
        if: always()
        run: |
          echo "## 📊 Allure Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report link:** [${{ steps.vercel_deploy.outputs.url }}](${{ steps.vercel_deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_number }} | Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY